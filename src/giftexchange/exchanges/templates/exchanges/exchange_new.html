{% extends "base.html" %}
{% block title %}New Gift Exchange · {% endblock %}
{% block content %}
<h1>New Gift Exchange</h1>
<p class="muted">Everyone in {{ circle.name }} starts off taking part. You can change that next.</p>
<form method="post" class="card">
  {% csrf_token %}
  {% include "form.html" %}
  <p class="actions"><button>Create gift exchange</button> <a class="button secondary" href="{% url 'circle' circle.pk %}">Cancel</a></p>
</form>
{% endblock %}
