[project]
name = "giftexchange"
version = "0.1.0"
description = "A small, invite-only web app for running gift exchanges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dave-finlay", email = "davefinlay+github@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
