[project]
name = "giftexchange"
version = "0.10.0"
description = "A small, invite-only web app for running gift exchanges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dave-finlay", email = "davefinlay+github@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "django>=5.2,<5.3",
    "django-anymail>=15.2",
    "django-axes>=8.3.1",
    "gunicorn>=26.2.0",
    "whitenoise>=6.12.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff]
line-length = 88
# Generated by Django
extend-exclude = ["src/giftexchange/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
