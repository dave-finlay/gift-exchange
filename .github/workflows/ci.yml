name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; jobs ask for more only if they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs, not tags, because a tag can
      # be moved to point at different code. Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: "1"
          DATA_DIR: ${{ runner.temp }}/data
      - name: Check production settings
        # With throwaway secrets: production ones never reach CI.
        run: |
          mkdir -p "$SECRETS_DIR"
          uv run python -c "import secrets; print(secrets.token_urlsafe(50))" \
            > "$SECRETS_DIR/django_secret_key"
          uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" \
            > "$SECRETS_DIR/assignment_keys"
          uv run python manage.py check --deploy --fail-level WARNING
        env:
          SECRETS_DIR: ${{ runner.temp }}/secrets
          SITE_DOMAIN: example.org
