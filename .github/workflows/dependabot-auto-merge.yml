name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's pull requests. GitHub then merges
# each one once the checks that main requires (CI's test job) have passed.
# Major updates (e.g. 1.x to 2.x) aren't merged automatically: they wait
# for a person to review them.

on: pull_request

permissions: {}

jobs:
  auto-merge:
    # The pull request's author, not github.actor, which can be someone
    # else re-running the workflow.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read what it updates
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge once CI passes, unless it's a major update
        # For a group of updates, this is the largest of them.
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
