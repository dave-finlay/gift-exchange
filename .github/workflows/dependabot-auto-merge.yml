name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's pull requests. GitHub then merges
# each one once the checks that main requires (CI's test job) have passed.
# Major updates (e.g. 1.x to 2.x) aren't merged automatically: they wait
# for a person to review them.

on: pull_request

permissions: {}

jobs:
  auto-merge:
    # The pull request's author, not github.actor, which can be someone
    # else re-running the workflow.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge once CI passes, unless it's a major update
        # Dependabot lists each update at the end of its commit message,
        # with an update type for each version change. A new build of the
        # same base image tag (python:3.13-slim at a new digest, which is
        # how Debian and Python fixes arrive) has no update type.
        # dependabot/fetch-metadata counted that as major, so base-image
        # fixes were never merged; this reads Dependabot's own list.
        run: |
          if gh pr view "$PR_URL" --json commits --jq '.commits[0].messageBody' \
            | grep -q 'update-type: version-update:semver-major'; then
            echo "A major update: it waits for review."
          else
            gh pr merge --auto --squash "$PR_URL"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
