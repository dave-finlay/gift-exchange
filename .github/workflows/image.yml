name: Image

# Builds the app image, checks that it starts and serves pages (on its
# own, then behind Caddy as on the server, with deploy/check.sh), and
# scans it with grype. It does all this twice: for the Debian-based image
# (Dockerfile, tags main and sha-<commit>) and the Alpine one
# (Dockerfile.alpine, the same tags with -alpine on the end). On main, and daily, it also publishes it to GitHub's
# container registry, with signed attestations of where it was built
# (build provenance) and what's in it (an SBOM, from syft), so that each
# image can be traced to its commit. The daily run picks up new
# vulnerability reports, and changes merged by Dependabot (whose merges
# don't start workflows).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (${{ matrix.variant }})
    # The server is ARM, so the image is built on ARM.
    runs-on: ubuntu-24.04-arm
    strategy:
      # One image failing doesn't stop the other being checked and
      # published.
      fail-fast: false
      matrix:
        include:
          - variant: debian
            dockerfile: Dockerfile
            suffix: ""
            category: grype
            no-cache: ""
          - variant: alpine
            dockerfile: Dockerfile.alpine
            suffix: -alpine
            # Each image's scan results under their own category, so that
            # uploading one image's doesn't close the other's alerts.
            category: grype-alpine
            # Its final stage runs apk upgrade, so it's never taken from
            # the cache: each build gets Alpine's newest fixes.
            no-cache: run
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # Publish the image (not from pull requests)
      security-events: write # Upload scan results to the Security tab
      id-token: write # Sign the attestations (not from pull requests)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: gift-exchange:ci
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          no-cache-filters: ${{ matrix.no-cache }}

      - name: Check that it starts and serves pages
        # With throwaway secrets: production ones never reach CI.
        run: |
          mkdir -p secrets
          python3 -c "import secrets; print(secrets.token_urlsafe(50))" > secrets/django_secret_key
          python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())" > secrets/assignment_keys
          echo "not-a-real-key" > secrets/mailjet_api_key
          echo "not-a-real-key" > secrets/mailjet_secret_key
          docker run -d --name app -p 8000:8000 -e SITE_DOMAIN=example.org \
            -v "$PWD/secrets:/run/secrets:ro" gift-exchange:ci
          get() { curl -fsS -H "Host: example.org" -H "X-Forwarded-Proto: https" "http://localhost:8000$1"; }
          for _ in $(seq 30); do get /signin/ > signin.html 2>/dev/null && break; sleep 1; done
          grep -q "Sign in" signin.html
          css=$(grep -o '/static/site\.[0-9a-f]*\.css' signin.html)
          get "$css" > /dev/null
          echo "Serves /signin/ and $css"
      - name: Show the app's log
        if: failure()
        run: docker logs app

      - name: Run it behind Caddy, as on the server, and check the site
        # The same throwaway secrets, with Caddy's own certificate for
        # localhost.
        run: |
          mkdir -p "$GIFT_EXCHANGE_ETC/secrets"
          cp -r secrets "$GIFT_EXCHANGE_ETC/secrets/app"
          echo "SITE_DOMAIN=localhost" > "$GIFT_EXCHANGE_ETC/site.env"
          cd deploy
          docker compose up --detach --wait
          ./check.sh localhost
        env:
          GIFT_EXCHANGE_ETC: ${{ runner.temp }}/etc
          APP_IMAGE: gift-exchange:ci
      - name: Show the site's log
        if: failure()
        run: docker compose --file deploy/compose.yaml logs
        env:
          GIFT_EXCHANGE_ETC: ${{ runner.temp }}/etc
          APP_IMAGE: gift-exchange:ci

      # Without the action's cache-db: it caches the database under a key
      # that names only grype's version, so the cached copy never updates.
      # Grype rejected it as too old, then downloaded a fresh database for
      # each scan. Now the first scan downloads it and the second reuses it.
      - name: Scan (fails on fixable high or critical vulnerabilities)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: gift-exchange:ci
          only-fixed: true
          severity-cutoff: high
          output-format: table
      - name: Scan (everything, for the Security tab)
        id: report
        if: always()
        # Reporting, not a gate, like the upload below: a hiccup in either
        # shouldn't stop an image that passed the scan from being published.
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: gift-exchange:ci
          fail-build: false
          output-format: sarif
      - name: Upload the scan to the Security tab
        if: always() && steps.report.outputs.sarif
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.report.outputs.sarif }}
          category: ${{ matrix.category }}

      - name: Publish
        id: publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          for tag in "main$SUFFIX" "sha-${GITHUB_SHA::12}$SUFFIX"; do
            docker tag gift-exchange:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::12}$SUFFIX" --format '{{json .Manifest.Digest}}')
          echo "digest=$(echo "$digest" | tr -d '"')" >> "$GITHUB_OUTPUT"
      - name: Sign where it was built and attach that to the image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Make its SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Sign the SBOM and attach it to the image
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
